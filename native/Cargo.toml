[package]
name = "foamy-audio-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Bounded children, JSON replies, atomic files, bounded reads (the kit).
foamy-helper = { path = "../kit/rust/foamy-helper" }
# pactl's JSON lists, the state files and every reply.
serde_json = "1"
# poll(2) for the capture loop, PR_SET_PDEATHSIG for pw-record, kill(2), getuid.
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "process"] }
# sigaction for the TERM/INT self-pipe of the capture loop.
libc = "0.2.153"
